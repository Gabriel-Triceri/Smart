server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # A aplicação usa react-router (/login, /app, /404). Sem este fallback,
    # recarregar a página numa rota que não seja "/" devolve 404 do nginx,
    # porque não existe arquivo correspondente no disco.
    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff2?)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
