# Os quatro jobs de NotificacaoAgendadaService passaram a rodar de verdade
# (@EnableScheduling). "-" é o valor que o Spring entende como cron desabilitado:
# subir o contexto de teste não deve disparar envio de e-mail.
app.notificacoes.lembrete-checklist.cron=-
app.notificacoes.pendencias.cron=-
app.notificacoes.tarefas-pendentes.cron=-
app.notificacoes.presencas-atrasadas.cron=-
