# Configuração única da aplicação.
# Antes existiam application.properties e application.yml ao mesmo tempo. O
# Spring mesclava os dois (o .properties vencendo nas chaves conflitantes), o
# que deixava o comportamento efetivo difícil de prever: ddl-auto e o segredo
# JWT vinham do .properties, enquanto data.sql, e-mail e CORS vinham do .yml.
# Os valores abaixo reproduzem exatamente essa configuração efetiva.

spring:
  datasource:
    url: jdbc:h2:file:./data/smartmeeting;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      # "update" preserva os dados entre reinicializações. O seed (data.sql) é
      # idempotente — usa MERGE ... KEY(...) — então continua podendo rodar
      # sempre sem duplicar nada.
      # Use DDL_AUTO=create-drop para começar de um banco limpo.
      ddl-auto: ${DDL_AUTO:update}
    show-sql: true
    open-in-view: false
    defer-datasource-initialization: true
    properties:
      hibernate:
        format_sql: true
        highlight_sql: true
  sql:
    init:
      mode: always
      encoding: UTF-8
  h2:
    console:
      enabled: true
      path: /h2-console
  mail:
    host: ${MAIL_HOST:sandbox.smtp.mailtrap.io}
    port: ${MAIL_PORT:2525}
    # Credenciais de exemplo: o envio real de e-mail só funciona definindo
    # MAIL_USERNAME/MAIL_PASSWORD no ambiente.
    username: ${MAIL_USERNAME:a1b2c3d4e5f6g7}
    password: ${MAIL_PASSWORD:a1b2c3d4e5f6g7}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}
  error:
    include-message: always
    include-binding-errors: always

app:
  jwt:
    # Sobrescreva JWT_SECRET em qualquer ambiente que não seja local.
    secret: ${JWT_SECRET:secretkeysecretkeysecretkeysecretkeysecretkeysecretkeysecretkeysecretkey}
    expiration-ms: 86400000
  # SecurityConfig e WebSocketConfig leem esta propriedade, evitando URLs
  # hardcoded no código.
  cors:
    allowed-origins:
      - http://localhost:3000
      - http://localhost:3001

logging:
  level:
    root: INFO
    org.springframework: INFO
    org.springframework.web: DEBUG
    org.springframework.web.servlet.DispatcherServlet: DEBUG
    org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver: DEBUG
    org.springframework.web.servlet.error.BasicErrorController: DEBUG
    org.springframework.boot.autoconfigure.web.servlet.error.BasicErrorController: DEBUG
    org.springframework.security: DEBUG
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.hibernate.engine.jdbc.spi.SqlExceptionHelper: ERROR
    com.smartmeeting: DEBUG
