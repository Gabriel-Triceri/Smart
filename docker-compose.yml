# Sobe o SmartMeeting inteiro com um comando:
#
#   docker compose up --build
#
# Frontend: http://localhost:3000   Backend: http://localhost:8080
# Login do seed: alice.admin@smart.com / admin123

services:
  backend:
    build:
      context: ./smartmeeting-api/backend
    ports:
      - "8080:8080"
    environment:
      # Preserva os dados. Use create-drop para começar de um banco limpo.
      DDL_AUTO: update
      # Precisa bater com a origem de onde o navegador carrega o frontend,
      # senão o navegador bloqueia toda chamada por CORS.
      APP_CORS_ALLOWED_ORIGINS: http://localhost:3000
      # Troque em qualquer ambiente que não seja local.
      JWT_SECRET: ${JWT_SECRET:-secretkeysecretkeysecretkeysecretkeysecretkeysecretkeysecretkeysecretkey}
    volumes:
      # O H2 grava em /app/data (ver o WORKDIR do Dockerfile). Sem este volume
      # os dados somem quando o container é recriado — mesmo com DDL_AUTO=update.
      - smartmeeting-data:/app/data
    healthcheck:
      # /v3/api-docs é liberado no SecurityConfig e devolve 200 — serve como
      # prova de que a aplicação subiu, sem precisar de credencial.
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:8080/v3/api-docs"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  frontend:
    build:
      context: ./smartmeeting-api/front
      args:
        # Resolvido no BUILD pelo Vite — o navegador do usuário chama este
        # endereço diretamente, então precisa ser alcançável a partir DELE,
        # e não de dentro da rede do compose ("http://backend:8080" não serve).
        VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  smartmeeting-data:
